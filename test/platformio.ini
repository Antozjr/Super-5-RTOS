; platformio.ini para tests unitarios nativos (sin hardware)
; Ejecutar desde la carpeta raíz del proyecto:
;   pio test -e test_native --project-dir test/

[env:test_native]
platform   = native
framework  =
test_framework = unity

build_flags =
    -std=c++17
    -I../shared

; Ejecutar ambas suites
test_filter =
    test_protocol
    test_messages
