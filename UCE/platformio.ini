[env:UCE]
platform      = ststm32
board         = genericSTM32F405RG   ; WeAct STM32F405RGT6 bare board (no Nucleo)
framework     = arduino

upload_protocol = stlink             ; ST-Link V2 clone
upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0         ; Monitor serie via CP2102 en USART1
monitor_speed = 115200

lib_deps =
    stm32duino/STM32duino FreeRTOS @ ^10.3.1
    bblanchon/ArduinoJson    @ ^7.0.0

build_flags =
    -DSTM32F4xx
    -DSTM32F405xx            ; CMSIS: activa stm32f405xx.h (define CAN1_RX0_IRQn, etc.)
    -DUSB_NONE               ; Sin USB CDC → TunerStudio usa USART (CP2102), no conflictos
    -DUSE_FREERTOS
    -DUCE_NODE
    -DFIRMWARE_VERSION=\"3.0.0\"
    -O2
    -ffast-math

lib_extra_dirs = lib
