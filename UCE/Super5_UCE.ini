; Super5_UCE.ini - Archivo de configuración TunerStudio
; Compatible con TunerStudio MS 3.x+
;
; Instrucciones:
;   1. Abrir TunerStudio → File → Open Project
;   2. Seleccionar este archivo .ini
;   3. Conectar al puerto COM del STM32F405 (USB CDC)
;   4. Baudrate: 115200
;
; TODO: Completar con definición completa de páginas y gauges.

[MegaTune]
    MTversion       = 2.25
    queryCommand    = "Q"
    signature       = "Super5_UCE v3.0"

[TunerStudio]
    queryCommand    = "Q"
    signature       = "Super5_UCE v3.0"
    versionInfo     = "S"
    ecu_clock       = 168000000
    ecu_clock_amb   = 168000000

[Constants]
    pageCount       = 2
    nTableBlocks    = 2
    pageActivate    = {page}

    page = 1
    ; Tabla VE 16×16 = 256 bytes
    ; Tabla IGN 16×16 = 256 bytes (firmado)
    ; Total página 1: 512 bytes

    page = 2
    ; Tabla AFR 16×16 = 256 bytes
    ; Constantes escalares = 64 bytes
    ; Total página 2: 320 bytes

[OutputChannels]
    ; Canales de datos en tiempo real (estructura TSIO_RealtimeData_t, 16 bytes)
    ochBlockSize    = 16

    rpm             = { S16, 0,  1.0,  0.0, "RPM",   "%d"   }
    map             = { U8,  2,  1.0,  0.0, "kPa",   "%.0f" }
    tps             = { U8,  3,  1.0,  0.0, "%",     "%.0f" }
    clt             = { S8,  4,  1.0,  0.0, "°C",    "%.0f" }
    iat             = { S8,  5,  1.0,  0.0, "°C",    "%.0f" }
    batt            = { U8,  6,  0.1,  0.0, "V",     "%.1f" }
    advance         = { U8,  7,  1.0, -10.0,"°BTDC", "%.1f" }
    inj_pw          = { U16, 8,  10.0, 0.0, "µs",    "%.0f" }
    ve              = { U8,  10, 1.0,  0.0, "%",     "%.0f" }
    afr             = { U8,  11, 0.1,  0.0, "AFR",   "%.1f" }
    status          = { U8,  12, 1.0,  0.0, "",      "%d"   }
    lambda          = { U8,  13, 0.1,  0.0, "AFR",   "%.1f" }

[Gauges]
    ; Gauges principales del dashboard
    gauge1          = rpmGauge,        rpm,      "RPM",    "",  0,   8000, 6000, 7000, 3, 0
    gauge2          = mapGauge,        map,      "MAP",    "kPa", 20, 250,  10,  240, 3, 0
    gauge3          = cltGauge,        clt,      "CLT",    "°C", -20, 130,  0,   110, 2, 0
    gauge4          = iatGauge,        iat,      "IAT",    "°C", -20, 80,   0,    60, 2, 0
    gauge5          = tpsGauge,        tps,      "TPS",    "%",   0,  100,  2,   98,  1, 0
    gauge6          = battGauge,       batt,     "BATT",   "V",   6,   16, 10,   15,  1, 0
    gauge7          = advanceGauge,    advance,  "Advance","°",   0,   45,  2,   40,  1, 0
    gauge8          = afrGauge,        afr,      "AFR",    "",   10,   17, 11,   16,  1, 0
