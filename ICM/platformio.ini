[env:ICM]
platform      = ststm32
board         = bluepill_f103c8
framework     = arduino

upload_protocol = stlink
monitor_port  = /dev/ttyUSB1 ; Monitor serie via CP2102
monitor_speed = 115200

lib_deps =
    stm32duino/STM32duino FreeRTOS @ ^10.3.1
    bblanchon/ArduinoJson          @ ^7.0.0
    adafruit/Adafruit INA219       @ ^1.2.3

build_flags =
    -DSTM32F1xx
    -DSTM32F103x8        ; CMSIS: activa stm32f103x8.h
    -DUSB_NONE           ; Deshabilita USB CDC → libera USB_LP_CAN1_RX0_IRQn para CAN
    -DUSE_FREERTOS
    -DICM_NODE
    -DFIRMWARE_VERSION=\"3.1.0\"
    -Os

lib_extra_dirs = lib
