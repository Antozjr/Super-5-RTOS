[env:Gateway]
platform      = espressif32
board         = esp32dev
framework     = arduino

upload_port   = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
upload_speed  = 921600
monitor_port  = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson       @ ^7.0.0
    links2004/WebSockets        @ ^2.4.1
    me-no-dev/AsyncTCP          @ ^1.1.1
    me-no-dev/ESPAsyncWebServer @ ^1.2.3
    https://github.com/autowp/arduino-mcp2515.git

build_flags =
    -DGATEWAY_NODE
    -DFIRMWARE_VERSION=\"3.2.0\"
    -DCORE_DEBUG_LEVEL=0
    -O2

; Partición con espacio para filesystem SPIFFS (data/)
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

; Subir filesystem (HTML/CSS/JS)
; Ejecutar: pio run -t uploadfs
