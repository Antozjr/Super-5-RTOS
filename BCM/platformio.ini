[env:BCM]
platform      = ststm32
board         = bluepill_f103c8
framework     = arduino

; Puerto serie (ajustar según sistema)
upload_protocol = stlink     ; Flashear via ST-Link V2 (no bootloader USB)
monitor_port  = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0 ; Monitor serie via CP2102 (PA9=TX → CP2102 RX)
monitor_speed = 115200

; Librerías
lib_deps =
    stm32duino/STM32duino FreeRTOS @ ^10.3.1
    bblanchon/ArduinoJson    @ ^7.0.0

; Flags de compilación
build_flags =
    -DSTM32F1xx
    -DSTM32F103x8        ; CMSIS: activa stm32f103x8.h (define CAN_BTR_TS1_x, USB_LP_CAN1_RX0_IRQn, etc.)
    -DUSB_NONE           ; Deshabilita USB CDC → libera USB_LP_CAN1_RX0_IRQn para nuestro ISR CAN
    -DUSE_FREERTOS
    -DBCM_NODE
    -DFIRMWARE_VERSION=\"3.2.0\"
    -Os

; Ruta librería CAN local
lib_extra_dirs = lib

; Ignorar advertencias de librerías externas
lib_ignore =
